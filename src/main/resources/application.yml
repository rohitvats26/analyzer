server:
  port: 8080

spring:
  application:
    name: impact-analyzer
  jackson:
    property-naming-strategy: SNAKE_CASE


github:
  token: ${GITHUB_TOKEN:your-github-token}  # Optional: Set your GitHub token for higher API limits
  webhook-secret: ${WEBHOOK_SECRET:your-webhook-secret}

openai:
  api:
    key: ${OPENAI_API_KEY:your-openai-key}  # Optional: Set your OpenAI API key for AI analysis

logging:
  level:
    com.impactanalyzer: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics